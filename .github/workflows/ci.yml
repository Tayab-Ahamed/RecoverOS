name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-verification:
    # The core is dependency-light; HTTP contract tests exercise the real API
    # and therefore install the pinned runtime dependencies below.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the container target; 3.13 is what reviewers tend to have
        # installed locally. Both must pass.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt
      - name: Static verification (no installs required)
        run: cd backend && python -m scripts.static_check
      - name: Test suite
        run: cd backend && python -m unittest discover -s tests -t . -v
      - name: SQL persistence and restart check
        run: cd backend && python -m scripts.verify_sql
      - name: Benchmark with invariant audit
        run: cd backend && python -m scripts.run_benchmark --events 10000 --seed 42
      - name: Counterfactual policy sweep
        # Prices each governed constraint, and self-checks the measurement:
        # fails if the governed baseline violates its own policy, if no
        # deliberately loosened variant trips the invariant auditor (which would
        # mean the auditor is asleep and every "zero violations" claim is
        # unfalsifiable), or if a defence-in-depth constraint stops holding when
        # its policy rule alone is disabled.
        run: cd backend && python -m scripts.run_counterfactual --events 2000 --seed 42
      - name: Committed artifacts match current code
        # Guards against a stale artifact making a published number
        # unreproducible. Every figure quoted in README.md comes from these.
        run: cd backend && python -m scripts.check_artifacts
      - name: Narrated demo
        run: cd backend && python -m scripts.demo

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: cd backend && ruff check .
      - name: Type check
        run: cd backend && mypy app
      - name: Architectural contracts
        run: cd backend && lint-imports

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Secret scan
        run: ./scripts/secret_scan.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
