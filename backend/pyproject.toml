[project]
name = "recoveros"
version = "0.1.0"
description = "Autonomous revenue recovery with deterministic governance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "B905", "B007", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
    "alembic.*",
    "app.api.deps",
    "app.repositories.sql",
    "app.agents.llm",
    "app.evaluation.harness",
    "app.api.v1.demo",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
